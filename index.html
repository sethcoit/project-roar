    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How does the Clienteling Revenue Audit work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "After you book, I set up a 30-minute discovery call to understand your business, your client base, and your current systems. You share access to whatever client data you have — CRM exports, POS reports, spreadsheets, or even associate notes. Within two weeks, you receive a written audit with a Clienteling Scorecard, a Revenue Opportunity Analysis, a VIP and dormant client review, a 90-day action plan, and ready-to-use outreach templates. We walk through it together on a follow-up call."
          }
        },
        {
          "@type": "Question",
          "name": "What do you need from us to get started?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "For the audit, I need whatever client data you can provide — even if it is messy or incomplete. Common sources include your POS or CRM export, a client list with purchase history, and any notes your team keeps on key clients. If your data is fragmented, that is exactly what I help you identify and fix. You do not need a polished database to begin."
          }
        },
        {
          "@type": "Question",
          "name": "Is the fractional director engagement month-to-month?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The fractional Clienteling Director engagement runs on a month-to-month basis with no long-term contract. I recommend a minimum of three months to see meaningful results, but you can adjust scope or pause with 30 days notice. Pricing scales with the depth of involvement — from monthly performance reviews at the entry level to weekly strategic leadership at the higher end."
          }
        },
        {
          "@type": "Question",
          "name": "What industries do you work with?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "I work with relationship-driven businesses where the customer lifetime value is high and personal service matters: fashion, jewelry, watches, automotive dealerships, interior design firms, real estate brokerages, plastic surgery and aesthetic practices, hospitality and private member services, yacht and aviation brokers, and bakeries and restaurants. If your revenue depends on repeat purchases, referrals, or long-term client relationships, the Magnolia Loop Method applies."
          }
        },
        {
          "@type": "Question",
          "name": "What if we do not have a CRM or client database?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "That is common and completely fine. Most businesses I speak with start with scattered spreadsheets, POS exports, or knowledge that lives only in their team's memory. Part of the audit includes recommending a lightweight clienteling setup that your team can actually maintain — whether that means configuring a simple CRM, building a structured spreadsheet, or improving an existing system."
          }
        },
        {
          "@type": "Question",
          "name": "How quickly can we expect to see results?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The 90-day action plan is built so your team can act on the highest-value opportunities first. How quickly revenue follows depends on your client base size, how quickly your team adopts the outreach cadence, and the dormancy level of your existing relationships. The fractional director engagement compounds these results over time through monthly accountability and refinement."
          }
        },
        {
          "@type": "Question",
          "name": "Do you work with businesses outside the luxury sector?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Magnolia Loop Method is built for businesses where relationships drive revenue, which extends beyond traditional luxury — to bakeries and restaurants with loyal regulars, professional services, and boutique hospitality. If you are unsure whether it fits, book a consultation and I will tell you honestly whether I can help."
          }
        },
        {
          "@type": "Question",
          "name": "What happens after the audit?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The audit is designed to be actionable on its own — you can implement the 90-day plan with their own team. If you want ongoing strategic leadership, the natural next step is the fractional Clienteling Director engagement, where I provide monthly accountability, performance reviews, and continued refinement. There is no obligation to continue; the audit stands alone as a complete deliverable."
          }
        }
      ]
    }
    </script>
