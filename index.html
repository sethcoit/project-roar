    <script type="application/ld+json">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How does the Clienteling Revenue Audit work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "After you book, we schedule a 30-minute discovery call to understand your business, your client base, and your current systems. You share access to whatever client data you have. Within two weeks, you receive a written audit with a Clienteling Scorecard, a Revenue Opportunity Analysis, a VIP and dormant client review, a 90-day action plan, and ready-to-use outreach templates. We walk through it together on a follow-up call."
          }
        },
        {
          "@type": "Question",
          "name": "What do you need from us to get started?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "For the audit, we need whatever client data you can provide — even if it is messy or incomplete. Common sources include your POS or CRM export, a client list with purchase history, and any notes your team keeps on key clients. If your data is fragmented, that is exactly what we help you identify and fix."
          }
        },
        {
          "@type": "Question",
          "name": "Is the fractional director engagement month-to-month?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. The fractional Clienteling Director engagement runs on a month-to-month basis with no long-term contract. Most clients engage for a minimum of three months to see meaningful results, but you can adjust scope or pause with 30 days notice."
          }
        },
        {
          "@type": "Question",
          "name": "What industries do you work with?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We specialize in relationship-driven businesses where the customer lifetime value is high and personal service matters: fashion, jewelry, watches, interiors, transportation, real estate, hospitality, medical, and high-end services. If your revenue depends on repeat purchases, referrals, or long-term client relationships, the Magnolia Loop Method applies."
          }
        },
        {
          "@type": "Question",
          "name": "How quickly can we expect to see results?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Most clients see their first measurable revenue lift within 90 days of implementing the audit recommendations. The timeline depends on your client base size, how quickly your team adopts the outreach cadence, and the dormancy level of your existing relationships."
          }
        },
        {
          "@type": "Question",
          "name": "What happens after the audit?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The audit is designed to be actionable on its own. If you want ongoing strategic leadership, the natural next step is the fractional Clienteling Director engagement. There is no obligation to continue; the audit stands alone as a complete deliverable."
          }
        }
      ]
    }
    </script>
